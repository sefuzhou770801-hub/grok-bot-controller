<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Grok Bot 本机联动层</title>
  <desc id="desc">Groki Bot 设备经本机 HTTP 代理调用 gbot CLI，再连接已经登录的 Grok Bot 应用；代理提供 health 与 send 接口。</desc>
  <style>
    :root { color-scheme:light dark; --ink:#23324a; --muted:#5d6b82; --line:#6b7a90; --panel:#eff4fa; --panel-2:#e4ebf5; --accent:#4f46e5; --accent-soft:#e8e7ff; --teal:#0f766e; --teal-soft:#d9f3ef; --amber:#985b0d; --amber-soft:#fff0d2; }
    @media (prefers-color-scheme:dark) { :root { --ink:#e6edf7; --muted:#afbdd0; --line:#8997aa; --panel:#182332; --panel-2:#223146; --accent:#aaa5ff; --accent-soft:#302e5d; --teal:#68d9cb; --teal-soft:#163e3a; --amber:#ffca73; --amber-soft:#493619; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:var(--ink); }
    .title { font-size:25px; font-weight:700; } .subtitle { font-size:14px; fill:var(--muted); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; } .accent-panel { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; } .teal-panel { fill:var(--teal-soft); stroke:var(--teal); stroke-width:1.5; } .amber-panel { fill:var(--amber-soft); stroke:var(--amber); stroke-width:1.5; }
    .label { font-size:16px; font-weight:700; } .body { font-size:13px; fill:var(--muted); } .small { font-size:12px; fill:var(--muted); } .code { font-size:13px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .flow { fill:none; stroke:var(--line); stroke-width:2.5; marker-start:url(#arrow-start); marker-end:url(#arrow-end); }
  </style>
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0L0 5L10 10z" fill="var(--line)"/></marker>
  </defs>

  <text class="title" x="28" y="38">Grok Bot 联动层</text>
  <text class="subtitle" x="28" y="62">本机代理把设备请求转换为 gbot CLI 调用</text>

  <path class="flow" d="M198 195 H242"/>
  <path class="flow" d="M510 195 H554"/>
  <path class="flow" d="M726 195 H770"/>

  <g>
    <rect class="panel" x="24" y="112" width="174" height="166" rx="18"/>
    <rect class="accent-panel" x="65" y="134" width="92" height="72" rx="12"/>
    <path d="M84 169 Q97 153 111 169 Q125 185 138 169" fill="none" stroke="var(--accent)" stroke-width="2.7"/>
    <circle cx="84" cy="169" r="3" fill="var(--teal)"/><circle cx="111" cy="169" r="3" fill="var(--teal)"/><circle cx="138" cy="169" r="3" fill="var(--teal)"/>
    <text class="label" x="111" y="234" text-anchor="middle">Groki Bot 设备</text>
    <text class="body" x="111" y="258" text-anchor="middle">文本请求 ↔ 回复</text>
  </g>

  <g>
    <rect class="teal-panel" x="242" y="92" width="268" height="206" rx="18"/>
    <text class="label" x="376" y="125" text-anchor="middle">gbot_http_proxy.py</text>
    <text class="code" x="376" y="151" text-anchor="middle">127.0.0.1:18770</text>
    <rect class="panel" x="270" y="172" width="212" height="42" rx="9"/>
    <text class="code" x="290" y="198">GET /health</text>
    <text class="body" x="462" y="198" text-anchor="end">进程检查</text>
    <rect class="panel" x="270" y="224" width="212" height="42" rx="9"/>
    <text class="code" x="290" y="250">POST /send</text>
    <text class="body" x="462" y="250" text-anchor="end">发送并取回复</text>
    <text class="small" x="376" y="286" text-anchor="middle">仅绑定本机回环地址</text>
  </g>

  <g>
    <rect class="amber-panel" x="554" y="112" width="172" height="166" rx="18"/>
    <path d="M589 148h102v64H589z" fill="var(--panel)" stroke="var(--amber)" stroke-width="1.5"/>
    <path d="M602 169l11 9-11 9M622 189h36" fill="none" stroke="var(--amber)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="640" y="238" text-anchor="middle">gbot CLI</text>
    <text class="code" x="640" y="259" text-anchor="middle">gbot --json send</text>
  </g>

  <g>
    <rect class="accent-panel" x="770" y="112" width="166" height="166" rx="18"/>
    <path d="M805 187h96c16 0 23-19 11-30a24 24 0 0 0-34-21 34 34 0 0 0-63 12 21 21 0 0 0-10 39z" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/>
    <text class="label" x="853" y="222" text-anchor="middle">Grok Bot</text>
    <text class="body" x="853" y="246" text-anchor="middle">本机应用登录态</text>
  </g>

  <text class="small" x="220" y="186" text-anchor="middle">HTTP</text>
  <text class="small" x="532" y="186" text-anchor="middle">子进程</text>
  <text class="small" x="748" y="186" text-anchor="middle">会话</text>
  <text class="body" x="480" y="334" text-anchor="middle">gbot CLI 是外部依赖；代理本身不读写 token</text>
</svg>
